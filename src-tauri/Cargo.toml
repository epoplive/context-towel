[package]
name = "context-towel"
version = "0.1.0"
edition = "2021"
default-run = "context-towel"

[lib]
name = "context_towel"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "context-towel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSSavePanel", "NSOpenPanel", "NSApplication", "NSResponder", "NSWindow", "NSPanel"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSPathUtilities"] }
